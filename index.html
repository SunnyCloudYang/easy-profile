<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile</title>
    <meta name="description" content="Personal profile and portfolio">
    <link rel="stylesheet" href="assets/css/theme-default.css">
    <link rel="stylesheet" href="assets/css/core.css">
</head>
<body>
    <!-- App container -->
    <div id="app">
        <!-- Loading state -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
        </div>

        <!-- Main content will be rendered here -->
        <div id="content" style="display: none;"></div>
    </div>

    <!-- External libraries (load from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

    <!-- Core scripts -->
    <script src="assets/js/core/parser.js"></script>
    <script src="assets/js/core/loader.js"></script>
    <script src="assets/js/core/renderer.js"></script>
    <script src="assets/js/core/router.js"></script>
    <script src="assets/js/utils/dom.js"></script>
    <script src="assets/js/utils/markdown.js"></script>
    <script src="assets/js/extensions/registry.js"></script>
    <script src="assets/js/extensions/extension-manager.js"></script>
    <script src="assets/js/core/app.js"></script>

    <!-- Initialize app -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init().catch(error => {
                console.error('Failed to initialize app:', error);
                document.getElementById('loading').innerHTML =
                    '<div class="error">Failed to load. Please refresh the page.</div>';
            });
        });
    </script>
</body>
</html>
